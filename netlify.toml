[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium-min", "puppeteer-core"]

[[redirects]]
  from = "/r/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/reviews"
  to = "/booster.html"
  status = 200

[[redirects]]
  from = "/review/*"
  to = "/review.html"
  status = 200

[[redirects]]
  from = "/quotes"
  to = "/quotes.html"
  status = 200

[[redirects]]
  from = "/q/*"
  to = "/quote.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/fix/*"
  to = "/fix.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/reset"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/cancel"
  to = "/cancel.html"
  status = 200

[[redirects]]
  from = "/new-website"
  to = "/new-website.html"
  status = 200

[[redirects]]
  from = "/help"
  to = "/help.html"
  status = 200

[[redirects]]
  from = "/builds"
  to = "/builds.html"
  status = 200

[[redirects]]
  from = "/paid"
  to = "/paid.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/account"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/fix/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/builds"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/paid"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/reset"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/r/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/reviews"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/booster.html"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/quotes"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/quotes.html"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/review/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/review.html"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Frame-Options = "DENY"

# the public quote calculator is made to be embedded on owners' websites
[[headers]]
  for = "/q/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
